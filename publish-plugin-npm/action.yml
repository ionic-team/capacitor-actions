name: 'Publish Plugin'
description: 'Publish Plugin to NPM'
inputs:
  working-directory: 
    description: 'Package working directory'
    required: true
  gh-token:
    required: true
  npm-tag:
    required: true
  xcode-version:
    description: "Xcode version to build with"
    required: false
    default: 27.0

runs:
  using: 'composite'
  steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ inputs.gh-token }}
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@v1.0.0
        with:
          working-directory: ${{ inputs.working-directory }}
          gh-token: ${{ github.token }}
          xcode-version: ${{ inputs.xcode-version }}
      - name: Release
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ inputs.gh-token }}
          GH_TOKEN: ${{ inputs.gh-token }}
        run: npm publish --tag ${{ inputs.npm-tag }} --provenance
