name: "Build Plugin"

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: ./packages/capacitor-plugin 
    secrets:
      THE_GH_RELEASE_TOKEN:
        required: false

jobs:
  build:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@0593e5113cff6305d18e218c9d6768fd010406b4
        with:
          working-directory: ${{ inputs.working-directory }}
          gh-token: ${{ github.token }}

      - name: "Copy README.md in root"
        working-directory: ${{ inputs.working-directory }}
        run: cp README.md README.md.original

      - name: "Build Packages"
        working-directory: ${{ inputs.working-directory }}
        run: npm run build

      - name: "Check README.md changes"
        working-directory: ${{ inputs.working-directory }}
        run: |
          if ! cmp --silent README.md README.md.original; then
            echo "Detected README.md changes; Do 'npm run build' to update the docs."
            exit 1
          fi
