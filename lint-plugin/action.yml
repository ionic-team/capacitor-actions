name: 'Lint Plugin'
description: 'Run lint requirements against Plugin'
inputs:
  working-directory: 
    description: 'package working directory'
    required: true
  gh-token:
    required: true

runs:
  using: 'composite'
  steps:
      - name: 'Setup Environment'
        id: setup
        uses: ionic-team/capacitor-actions/setup-tools@v1.0.0
        with:
          working-directory: ${{ inputs.working-directory }}
          gh-token: ${{ github.token }}

      - name: 'Lint Packages'
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: npm run lint
