name: 'Build Capacitor Plugin'
description: 'Build Plugin for Capacitor'
inputs:
  working-directory:
    description: 'Package working directory'
    required: true
  gh-token:
    description: 'Github Token'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 'Setup Environment'
      id: setup
      uses: ionic-team/capacitor-actions/setup-tools@v1.0.0
      with:
        working-directory: ${{ inputs.working-directory }}
        gh-token: ${{ github.token }}

    - name: "Copy README.md in root"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: cp README.md README.md.original

    - name: "Build Packages"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: npm run build

    - name: "Check README.md changes"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        if ! cmp --silent README.md README.md.original; then
          echo "Detected README.md changes; Do 'npm run build' to update the docs."
          exit 1
        fi
