name: 'Setup Tools'
description: 'Setup tools needed in repo'
inputs:
  working-directory: 
    description: 'Package working directory'
    required: true
  gh-token:
    required: true
  xcode-version:
    description: "Xcode version to build with"
    required: false
    default: 27.0

runs:
  using: 'composite'
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        token: ${{ inputs.gh-token }}
    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install dependencies
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: npm i
    - name: Set Xcode ${{ inputs.xcode-version }}  # minimum support Xcode version by Capacitor 8
      if: runner.os == 'macOS'
      shell: bash
      run: sudo xcode-select --switch /Applications/Xcode_${{ inputs.xcode-version }}.app